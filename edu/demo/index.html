<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Edu Document & VM Viewers Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F5F7FA; color: #2D3748; }
    header { background: #1A365D; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 1.1rem; font-weight: 600; }
    .badge { background: #319795; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; }
    nav { display: flex; background: #2B6CB0; overflow-x: auto; padding: 0 12px; }
    nav button { background: transparent; border: none; color: #E2E8F0; padding: 12px 16px; font-size: 0.9rem; font-weight: 500; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
    nav button.active { color: white; border-bottom-color: #38B2AC; font-weight: 600; }
    main { width: 100%; height: calc(100vh - 105px); position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: white; }
  </style>
</head>
<body>
  <header>
    <h1>全格式文档 & VM 浏览器统一呈现沙箱</h1>
    <span class="badge">跨端通用 / 离线运行</span>
  </header>
  <nav>
    <button class="active" onclick="switchViewer('docx')">📄 Word 文档 (Docx)</button>
    <button onclick="switchViewer('sheet')">📊 Excel 表格 (Sheet)</button>
    <button onclick="switchViewer('pptx')">📽️ PPT 演示文稿</button>
    <button onclick="switchViewer('pdf')">📑 PDF 预览与打印</button>
    <button onclick="switchViewer('vnc')">🖥️ 远程桌面 (VM VNC)</button>
  </nav>
  <main>
    <iframe id="viewer-frame" src="../viewers/docx/index.html"></iframe>
  </main>
  <script>
    const routes = {
      docx: '../viewers/docx/index.html',
      sheet: '../viewers/sheet/index.html',
      pptx: '../viewers/pptx/index.html',
      pdf: '../viewers/pdf/index.html',
      vnc: '../viewers/vmvnc/vnc.html'
    };
    function switchViewer(key) {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('viewer-frame').src = routes[key];
    }
  </script>
</body>
</html>
