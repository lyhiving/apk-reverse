<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <!-- minimum-scale/maximum-scale must differ and user-scalable must stay on, or WebView
         disables pinch-zoom no matter what setSupportZoom/builtInZoomControls say. -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="color-scheme" content="only light">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">

    <link rel="stylesheet" href="pptxjs.min.css">
    <link rel="stylesheet" href="nv.d3.min.css">

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #F8FAFC;
            color: #272727;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
        }
        #document-container {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
        }
        #all_slides_warpper, .slides {
            width: 100% !important;
            max-width: 100vw !important;
            overflow: hidden !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 !important;
            padding: 0 !important;
        }
        .slide-scale-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .slide {
            flex-shrink: 0 !important;
        }
    </style>

    <script type="text/javascript" src="../common/bridge-shim.js"></script>
    <script type="text/javascript" src="jszip.min.js"></script>
    <script type="text/javascript" src="filereader.min.js"></script>
    <script type="text/javascript" src="d3.min.js"></script>
    <script type="text/javascript" src="nv.d3.min.js"></script>
    <script type="text/javascript" src="pptxjs.min.js"></script>
    <script type="text/javascript" src="hatch_pptx_viewer.js?v=2"></script>
</head>

<body>
    <div id="document-container"></div>
</body>

</html>
