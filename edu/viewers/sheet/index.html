<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <!-- minimum-scale/maximum-scale must differ and user-scalable must stay on, or WebView
         disables pinch-zoom no matter what setSupportZoom/builtInZoomControls say. -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="color-scheme" content="only light">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #FFFFFF;
            color: #272727;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
        }

        /* Sheet switcher, matching how iOS presents a multi-sheet workbook. Scrolls horizontally
           because workbooks routinely carry more sheet names than fit a phone width. */
        .sheet-tabs {
            display: flex;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-bottom: 1px solid #DDE1E5;
            background: #FFFFFF;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .sheet-tab {
            flex: 0 0 auto;
            appearance: none;
            border: none;
            background: transparent;
            font: inherit;
            color: #60707C;
            padding: 10px 14px;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .sheet-tab-active {
            color: #17324D;
            font-weight: 600;
            border-bottom-color: #1A7F79;
        }

        /* Each sheet scrolls horizontally on its own so a wide sheet does not force the whole
           page sideways and strand the narrow ones. */
        .sheet-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* SheetJS emits a bare <table>; the grid styling is ours. `table-layout: fixed` makes it
           honour the <colgroup> widths reattached from the workbook's own column widths. */
        table {
            border-collapse: collapse;
            table-layout: fixed;
            width: max-content;
            min-width: 100%;
        }

        td,
        th {
            border: 1px solid #DDE1E5;
            padding: 6px 10px;
            /* pre-wrap, not pre: cells carry long prose in this kind of workbook, and `pre` ran it
               off the right edge instead of wrapping inside the column. */
            white-space: pre-wrap;
            overflow-wrap: break-word;
            vertical-align: top;
        }
    </style>

    <script type="text/javascript" src="../common/bridge-shim.js"></script>
    <script type="text/javascript" src="xlsx.full.min.js"></script>
    <script type="text/javascript" src="hatch_sheet_viewer.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        var params = new URLSearchParams(window.location.search);
        var file = params.get('file') || '../../demo/samples/sample.xlsx';
        if (window.loadFromSheetUrl) {
          window.loadFromSheetUrl(file);
        }
      });
    </script>
</head>

<body>
    <div id="document-container"></div>
</body>

</html>
